<div id="Index" style="display: none;">

</div>


<div id="Login" style="display: block;">
    
        <div class="imgcontainer">
        <!--  <img src="img_avatar2.png" alt="Avatar" class="avatar">   -->    
        </div>
  
        <div class="container">
            <label for="uname"><b>Nombre de Usuario</b></label>
            <input type="text" placeholder="Enter Username" required id="userLogin">
  
            <label for="psw"><b>Clave</b></label>
            <input type="password" placeholder="Enter Password" required id="passwordLogin">
  
            <button type="submit" id="btn_login">Ingresar</button>
            <label>
                <input type="checkbox" name="admin" id="checkAdm"> Ingresar como Administrador
            </label>
        </div>
  
        <div class="container" style="background-color:#f1f1f1">
            <button type="button" class="cancelbtn1" id="btn_gotoregister">Registrarse</button>
        </div>
  
</div>

<div id="Register" style="display: none;">
    <div style="border:1px solid #ccc">
        <div class="container">
          <h1>Registro</h1>
          <p>Por favor, completa todos los campos para crear tu usuario</p>
          <hr>
          <label for="username"><b>Username</b></label>
          <input type="text" id="usernameR" placeholder="Enter Username" name="email" required>
      

          <label for="FullName"><b>Nombre Completo</b></label>
          <input type="text" id="fullnameR" placeholder="Enter Full Name" name="fullname" required>

          <label for="DPI"><b>DPI</b></label>
          <input type="text" id="dpiR" placeholder="Enter DPI" name="dpi" required>
      
          <label for="Phone"><b>Telefono</b></label>
          <input type="text" id="phoneR" placeholder="Enter Phone" name="phone" required>

          <label for="psw"><b>Password</b></label>
          <input type="password" id="pswR" placeholder="Enter Password" name="psw" required>
      
      
          <p>By creating an account you agree to our <a style="color:dodgerblue">Terms & Privacy</a>.</p>
      
          <div class="clearfix">
            <button type="button" class="cancelbtn" id="btn_cancelRegister">Cancel</button>
            <button type="submit" class="signupbtn" id="btn_register">Sign Up</button>
          </div>
        </div>
    </div>
</div>

<div id="Admin" style="display: none;">
    <H1>Interfaz del Administrador</H1>
    <div class="input-group">
        <input type="file" class="form-control" id="inputGroupFile04" aria-describedby="inputGroupFileAddon04" aria-label="Upload">
        <button class="btn btn-outline-secondary" type="button" id="inputGroupFileAddon04">Cargar Usuarios</button>
    </div><br><br>

    <div class="input-group">
        <input type="file" class="form-control" id="inputGroupFile04" aria-describedby="inputGroupFileAddon04" aria-label="Upload">
        <button class="btn btn-outline-secondary" type="button" id="inputGroupFileAddon04">Cargar Artistas</button>
    </div><br><br>

    <div class="input-group">
        <input type="file" class="form-control" id="inputGroupFile04" aria-describedby="inputGroupFileAddon04" aria-label="Upload">
        <button class="btn btn-outline-secondary" type="button" id="inputGroupFileAddon04">Cargar Canciones</button>
    </div><br><br>

    <div class="input-group">
        <input type="file" class="form-control" id="inputGroupFile04" aria-describedby="inputGroupFileAddon04" aria-label="Upload">
        <button class="btn btn-outline-secondary" type="button" id="inputGroupFileAddon04">Cargar Podcast</button>
    </div><br><br>

    <div class="input-group">
        <input type="file" class="form-control" id="inputGroupFile04" aria-describedby="inputGroupFileAddon04" aria-label="Upload">
        <button class="btn btn-outline-secondary" type="button" id="inputGroupFileAddon04">Cargar Música Programada</button>
    </div><br><br>
</div>

<div id="User" style="display: none;">
    <H1>Interfaz del Usuario</H1>
</div >
